  <path d="M 8 16 V 10 C 8 8.895 8.895 8 10 8 H 16" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 32 8 H 38 C 39.105 8 40 8.895 40 10 V 16" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 8 32 V 38 C 8 39.105 8.895 40 10 40 H 16" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 32 40 H 38 C 39.105 40 40 39.105 40 38 V 32" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" />

  <!-- Open Book Base -->
  <path d="M 14 32 C 18 30 22 31 24 33 C 26 31 30 30 34 32 V 19 C 30 17 26 18 24 20 C 22 18 18 17 14 19 Z" fill="url(#primaryGrad)" fill-opacity="0.25" stroke="url(#primaryGrad)" stroke-width="2" stroke-linejoin="round" />
  <path d="M 24 20 V 33" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" />

  <!-- AI Sparkle Core -->
  <path d="M 24 10 L 25.5 14.5 L 30 16 L 25.5 17.5 L 24 22 L 22.5 17.5 L 18 16 L 22.5 14.5 Z" fill="#22D3EE" filter="url(#glow)" />
